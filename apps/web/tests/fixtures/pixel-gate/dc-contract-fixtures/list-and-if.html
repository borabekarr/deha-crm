<!DOCTYPE html>
<!-- Contract fixture: <sc-for> over objects (dotted keys) and scalars, nested
     <sc-if>, top-level <sc-if> toggling, and listSignature change detection
     (an unrelated setState must NOT re-clone rows). -->
<html>
<head>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div id="rows">
  <sc-for list="{{ items }}" as="it">
    <div class="row" data-k="{{ it.k }}"><span class="row-label">{{ it.label }}</span><sc-if value="{{ it.flag }}"><em class="row-flag">flagged</em></sc-if></div>
  </sc-for>
</div>
<ul id="scalars">
  <sc-for list="{{ words }}" as="w"><li class="word">{{ w }}</li></sc-for>
</ul>
<sc-if value="{{ open }}"><p id="drawer">drawer</p></sc-if>
<button id="toggle" onClick="{{ toggle }}">toggle</button>
<button id="add" onClick="{{ add }}">add</button>
<button id="touch" onClick="{{ touch }}">touch</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  state = {
    open: false,
    tick: 0,
    items: [
      { k: 'a', label: 'Alpha', flag: true },
      { k: 'b', label: 'Beta', flag: false },
    ],
  };
  toggle() {
    this.setState((s) => ({ open: !s.open }));
  }
  add() {
    this.setState((s) => ({ items: s.items.concat([{ k: 'c', label: 'Gamma', flag: false }]) }));
  }
  touch() {
    // Unrelated state key: the bound list's DATA is unchanged, so its rows must
    // survive this render untouched (listSignature equality).
    this.setState((s) => ({ tick: s.tick + 1 }));
  }
  renderVals() {
    return {
      items: this.state.items,
      words: ['one', 'two', 'three'],
      open: this.state.open,
      toggle: this.toggle.bind(this),
      add: this.add.bind(this),
      touch: this.touch.bind(this),
    };
  }
}
</script>
</body>
</html>
