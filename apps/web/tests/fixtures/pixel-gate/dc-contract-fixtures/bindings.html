<!DOCTYPE html>
<!-- Contract fixture: mustache text/style/ref/onClick bindings, props defaults,
     microtask-batched setState, and the instance-field-after-setState ordering
     the shim exists to preserve. Asserted by tests/dc-shim-contract.spec.ts. -->
<html>
<head>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>#helmet-marker { color: rgb(1, 2, 3); }</style>
</helmet>
<div id="root">
  <p id="label">{{ label }}</p>
  <p id="mixed">count {{ count }} of {{ total }}</p>
  <div id="box" style="{{ boxStyle }}" data-echo="v-{{ label }}"></div>
  <button id="bump" onClick="{{ bump }}">bump</button>
  <span id="measured" ref="{{ measure }}"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"default":"hello"}}'>
class Component extends DCLogic {
  state = { count: 0, total: 2 };
  componentDidMount() {
    this.setState({ total: 3 });
  }
  componentDidUpdate() {
    // Reads an instance field assigned on the line AFTER setState() in bump():
    // only observable because the shim defers render + componentDidUpdate to a
    // microtask (see the CONTRACT header in dc-support-shim.js).
    if (this._pendingBump) document.body.setAttribute('data-field-visible', 'yes');
  }
  measure(el) {
    if (el) el.setAttribute('data-ref-called', 'yes');
  }
  bump() {
    this.setState((s) => ({ count: s.count + 1 }));
    this._pendingBump = true;
  }
  renderVals() {
    return {
      label: this.props.label,
      count: this.state.count,
      total: this.state.total,
      boxStyle: { backgroundColor: 'rgb(16, 185, 129)', paddingLeft: '4px' },
      bump: this.bump.bind(this),
      measure: this.measure.bind(this),
    };
  }
}
</script>
</body>
</html>
