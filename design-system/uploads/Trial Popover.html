<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Popover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --background: #ffffff;
  --foreground: oklch(0.145 0 0);
  --card: #ffffff;
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --border: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --trigger-bg: var(--foreground);
  --inset-hi: rgba(255,255,255,0.7);
  --inset-btn: rgba(255,255,255,0.8);
  --body-border: var(--border);
  --stage: oklch(0.985 0 0);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --border: oklch(1 0 0 / 10%);
    --ring: oklch(0.556 0 0);
    --trigger-bg: var(--muted);
    --inset-hi: rgba(0,0,0,0.7);
    --inset-btn: rgba(0,0,0,0.7);
    --body-border: rgba(255,255,255,0.2);
    --stage: oklch(0.18 0 0);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --border: oklch(1 0 0 / 10%);
  --ring: oklch(0.556 0 0);
  --trigger-bg: var(--muted);
  --inset-hi: rgba(0,0,0,0.7);
  --inset-btn: rgba(0,0,0,0.7);
  --body-border: rgba(255,255,255,0.2);
  --stage: oklch(0.18 0 0);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--background);
  color: var(--foreground);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
a { color: inherit; }

/* ---------- demo shell ---------- */
.shell { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
.app {
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--stage);
  min-height: 560px;
  overflow: hidden;
}
.app-header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--background);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.02em; font-size: 15px; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--foreground); }
.app-body { padding: 28px 24px; display: grid; gap: 12px; }
.skeleton { height: 14px; border-radius: 7px; background: var(--muted); }
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  margin-top: 16px; font-size: 13px; color: var(--muted-foreground);
}
.controls label { display: inline-flex; align-items: center; gap: 8px; }
.controls input[type=range] { width: 140px; accent-color: #8880d1; }
.chip-btn {
  border: 1px solid var(--border); background: var(--background); color: var(--foreground);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
}
.chip-btn:hover { background: var(--muted); }

/* ---------- trigger ---------- */
.tp { display: inline-flex; align-items: center; gap: 10px; }
.tp-trigger {
  display: inline-flex; align-items: center; gap: 10px;
  height: 36px; padding: 6px 10px 6px 8px;
  border: 0; border-radius: 999px; cursor: pointer; user-select: none;
  background: var(--trigger-bg); color: #fff;
  font-size: 14px; line-height: 1; font-weight: 500; letter-spacing: -0.025em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 0 1px rgba(255,255,255,0.08);
  outline: none;
  transition: filter 200ms;
}
.tp-trigger:hover { filter: brightness(1.1); }
.tp-trigger:focus-visible {
  box-shadow: 0 0 0 2px var(--background), 0 0 0 4px color-mix(in oklab, var(--ring) 50%, transparent);
}
.tp-ring { flex-shrink: 0; transform: rotate(-90deg); }
.tp-ring .track { stroke: rgba(255,255,255,0.2); }
.tp-ring .meter { stroke: #9b93e2; transition: stroke-dashoffset 1.15s cubic-bezier(0.16,1,0.3,1); }
.tp-days { padding-right: 2px; font-size: 13px; color: #f4f4f5; letter-spacing: -0.025em; }
.tp-badge {
  border-radius: 999px; background: #8880d1; padding: 4px 6px;
  font-size: 12px; line-height: 1; font-weight: 600; letter-spacing: -0.025em;
  text-transform: uppercase; color: #fff;
}
.tp-avatar {
  width: 36px; height: 36px; border-radius: 999px; overflow: hidden; flex-shrink: 0;
  background: var(--muted); display: grid; place-items: center;
  font-size: 12px; color: var(--muted-foreground);
}
.tp-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- popup ---------- */
.tp-positioner { position: absolute; top: 0; left: 0; z-index: 50; isolation: isolate; }
.tp-popup {
  width: min(36rem, calc(100vw - 1.5rem));
  overflow: hidden;
  border-radius: 30px;
  background: var(--muted);
  padding: 4px;
  color: var(--foreground);
  box-shadow:
    0 28px 70px -28px rgba(0,0,0,0.45),
    0 8px 24px -16px rgba(0,0,0,0.2),
    0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent);
  outline: none;
  will-change: transform, opacity, filter;
}
.tp-body {
  border-radius: 2rem;
  border: 1px solid var(--body-border);
  background: var(--background);
  padding: 24px 16px 16px;
}
.tp-header { padding: 4px 6px 4px; }
.tp-icon {
  margin-bottom: 16px; display: inline-flex; width: 40px; height: 40px;
  align-items: center; justify-content: center;
  border-radius: 12px; background: #8880d1; color: #fff;
}
.tp-icon svg { width: 20px; height: 20px; }
.tp-title { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 600; letter-spacing: -0.025em; }
.tp-desc { margin: 4px 0 0; font-size: 14px; line-height: 1.375; color: var(--muted-foreground); }

.tp-plans { margin-top: 12px; display: grid; gap: 12px; }
@media (min-width: 640px) { .tp-plans { grid-template-columns: 1fr 1fr; } }

.tp-card {
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  border-radius: 22px; border: 1px solid var(--border); background: var(--muted);
  padding: 16px; letter-spacing: -0.03em; color: var(--foreground);
  box-shadow: inset 0 1px 0 var(--inset-hi);
}
.tp-card.featured { padding: 14px; }
.tp-accent {
  position: absolute; left: 0; right: 0; top: 0; margin: 2px 2px 0; height: 64px;
  border-radius: 18px 18px 0 0;
  background: linear-gradient(135deg,#2b9eb3 0%,#55b8c7 38%,#efe0cc 63%,#f0524b 100%);
}
.tp-card-head { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tp-card-name { margin: 0; font-size: 16px; line-height: 1; font-weight: 500; letter-spacing: -0.025em; }
.tp-card.featured .tp-card-name { color: #fff; }
.tp-card-badge {
  border-radius: 999px; background: #fff; padding: 4px 8px;
  font-size: 12px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; color: #1c1c1c;
  box-shadow: 0 8px 18px -12px rgba(0,0,0,0.5);
}
.tp-price {
  position: relative; z-index: 1; margin: 12px -12px 0;
  border-radius: 16px; background: #fff; padding: 14px 16px;
  box-shadow: 0 24px 32px -26px rgba(0,0,0,0.4);
}
:root[data-theme="dark"] .tp-price { background: var(--card); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tp-price { background: var(--card); } }
.tp-plan-desc { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; letter-spacing: -0.025em; color: var(--muted-foreground); }
.tp-amount-row { margin-top: 8px; display: flex; align-items: flex-end; gap: 8px; }
.tp-amount { font-size: 28px; line-height: 1; font-weight: 500; letter-spacing: -0.05em; }
.tp-suffix { flex-shrink: 0; padding-bottom: 2px; font-size: 12px; font-weight: 500; letter-spacing: -0.025em; color: var(--muted-foreground); }
.tp-cta {
  margin-top: 14px; display: inline-flex; height: 36px; width: 100%;
  align-items: center; justify-content: center;
  border-radius: 7px; border: 1px solid var(--border);
  font-size: 13px; font-weight: 500; letter-spacing: -0.02em; text-decoration: none;
  background: var(--muted); color: var(--foreground);
  box-shadow: inset 0 1px 0 var(--inset-btn);
  transition: all 200ms ease-out;
}
.tp-cta:hover { transform: translateY(-2px); background: var(--background); }
.tp-card.featured .tp-cta {
  border-color: transparent; background: var(--foreground); color: var(--background);
  box-shadow: 0 16px 24px -20px rgba(0,0,0,0.8);
}
.tp-card.featured .tp-cta:hover { background: color-mix(in oklab, var(--foreground) 90%, transparent); }
.tp-features {
  position: relative; z-index: 1; margin: 12px 0 0; padding: 0; list-style: none;
  display: grid; gap: 6px;
  font-size: 13px; line-height: 1; font-weight: 500; letter-spacing: -0.025em; color: var(--muted-foreground);
}
.tp-features li { display: flex; align-items: center; gap: 8px; }
.tp-features svg { width: 14px; height: 14px; flex-shrink: 0; }

.tp-footer {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--muted); padding: 10px 16px;
}
@media (min-width: 640px) { .tp-footer { flex-direction: row; align-items: center; justify-content: space-between; } }
.tp-footer p { margin: 0; display: flex; min-width: 0; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.375; color: var(--muted-foreground); }
.tp-footer p svg { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }
.tp-footer p a { color: var(--foreground); text-decoration: underline; text-decoration-color: #c5b8ed; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.tp-sales {
  display: inline-flex; flex-shrink: 0; align-items: center; gap: 6px; align-self: flex-start;
  border-radius: 12px; border: 1px solid var(--border); background: transparent;
  padding: 8px 12px; font-size: 14px; font-weight: 500; letter-spacing: -0.025em;
  color: var(--foreground); text-decoration: none; transition: background-color 150ms;
}
@media (min-width: 640px) { .tp-sales { align-self: auto; } }
.tp-sales:hover { background: color-mix(in oklab, var(--background) 70%, transparent); }
.tp-sales svg { width: 16px; height: 16px; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>

<script>
(() => {
  const PLANS = [
    { name: "Starter", description: "For individuals just getting started", price: 0,
      features: ["Up to 3 projects", "1 GB storage", "Basic analytics", "Community support", "Single user"] },
    { name: "Professional", description: "For freelancers and small teams", price: 19, featured: true, badge: "Most Popular",
      features: ["Unlimited projects", "50 GB storage", "Advanced analytics", "Priority email support", "Up to 5 team members", "Custom integrations"] },
  ];
  const TOTAL_DAYS = 14;
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.2 2.65 2.65L12.5 4.5" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const trigger = document.getElementById("tpTrigger");
  const daysEl = document.getElementById("tpDays");

  /* ---------- ring meter (size 20, stroke 2.75) ---------- */
  const SIZE = 20, STROKE = 2.75, R = (SIZE - STROKE) / 2, C = 2 * Math.PI * R;
  const ring = document.getElementById("tpRing");
  ring.querySelectorAll("circle").forEach(c => c.setAttribute("r", R));
  const meter = ring.querySelector(".meter");
  meter.setAttribute("stroke-dasharray", C);
  meter.style.strokeDashoffset = C;
  function setDays(d) {
    const days = Math.max(0, Math.ceil(d));
    daysEl.textContent = `${days} ${days === 1 ? "day" : "days"} left`;
    trigger.setAttribute("aria-label", `${daysEl.textContent}. Open plans`);
    const p = Math.min(1, Math.max(0, days / TOTAL_DAYS));
    meter.style.strokeDashoffset = C * (1 - p);
  }
  if (reduceMotion) meter.style.transition = "none";
  requestAnimationFrame(() => requestAnimationFrame(() => setDays(4)));

  /* ---------- motion helpers (spring 460/32/0.72, exit 0.22s [0.4,0,1,1]) ---------- */
  function springCurve(k = 460, c = 32, m = 0.72) {
    const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    if (z < 1) {
      const wd = w0 * Math.sqrt(1 - z * z);
      return t => 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
    }
    return t => 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  }
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
    const dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => { let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; } return sy(Math.min(1, Math.max(0, t))); };
  }
  const spring = springCurve();
  const exitEase = bezier(0.4, 0, 1, 1);

  const CLOSED = { o: 0, b: 12, s: 0.72, y: -18, rx: 16 };
  const OPEN   = { o: 1, b: 0,  s: 1,    y: 0,   rx: 0 };
  const EXIT   = { o: 0, b: 8,  s: 0.86, y: -12, rx: 10 };

  let positioner = null, popup = null, state = null, raf = 0, isOpen = false;

  function apply(st) {
    const o = Math.min(1, Math.max(0, st.o));
    popup.style.opacity = o;
    if (reduceMotion) return;
    popup.style.filter = `blur(${Math.max(0, st.b)}px)`;
    popup.style.transform = `perspective(920px) translateY(${st.y}px) scale(${st.s}) rotateX(${st.rx}deg)`;
  }
  function tween(from, to, durMs, ease, done) {
    cancelAnimationFrame(raf);
    const t0 = performance.now();
    const step = now => {
      const t = now - t0;
      const finished = durMs ? t >= durMs : (t > 300 && Math.abs(1 - ease(t / 1000)) < 0.0005);
      const p = finished ? 1 : (durMs ? ease(t / durMs) : ease(t / 1000));
      state = {};
      for (const k in to) state[k] = from[k] + (to[k] - from[k]) * p;
      apply(state);
      if (finished) { done && done(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  /* ---------- positioning: side bottom, align end, sideOffset 12, alignOffset -8 ---------- */
  function position() {
    if (!positioner) return;
    const r = trigger.getBoundingClientRect();
    const w = popup.offsetWidth;
    const pad = 12;
    let left = r.right + 8 - w;
    left = Math.min(Math.max(left, pad), document.documentElement.clientWidth - w - pad);
    const top = r.bottom + 12;
    positioner.style.transform = `translate(${left + scrollX}px, ${top + scrollY}px)`;
    const ox = r.left + r.width / 2 - left;
    popup.style.transformOrigin = `${ox}px -12px`;
  }

  function buildPopup() {
    const frag = document.getElementById("tpPopupTpl").content.cloneNode(true);
    positioner = frag.querySelector(".tp-positioner");
    popup = frag.querySelector(".tp-popup");
    popup.id = "tpPopup";
    const plansEl = frag.querySelector(".tp-plans");
    PLANS.forEach(plan => {
      const card = document.createElement("article");
      card.className = "tp-card" + (plan.featured ? " featured" : "");
      card.innerHTML = `
        ${plan.featured ? '<div class="tp-accent" aria-hidden="true"></div>' : ""}
        <div class="tp-card-head">
          <h3 class="tp-card-name">${plan.name}</h3>
          ${plan.badge ? `<span class="tp-card-badge">${plan.badge}</span>` : ""}
        </div>
        <div class="tp-price">
          <p class="tp-plan-desc">${plan.description}</p>
          <div class="tp-amount-row"><span class="tp-amount">$${plan.price}</span><span class="tp-suffix">/month</span></div>
          <a class="tp-cta" href="#">Select plan</a>
        </div>
        <ul class="tp-features">${plan.features.map(f => `<li>${CHECK}<span>${f}</span></li>`).join("")}</ul>`;
      plansEl.appendChild(card);
    });
    positioner.addEventListener("click", e => { if (e.target.closest("a[href='#']")) e.preventDefault(); });
    document.body.appendChild(frag);
    trigger.setAttribute("aria-controls", "tpPopup");
  }

  function openPopover() {
    if (isOpen) return;
    isOpen = true;
    trigger.setAttribute("aria-expanded", "true");
    if (!positioner) { buildPopup(); state = { ...CLOSED }; }
    position();
    const from = reduceMotion ? { ...CLOSED, o: state ? state.o : 0 } : { ...state };
    if (reduceMotion) tween(from, OPEN, 150, t => t);
    else tween(from, OPEN, 0, spring);

    // plan cards: stagger 0.08, delay 0.06, 0.5s bloom ease
    if (!reduceMotion) {
      popup.querySelectorAll(".tp-card").forEach((card, i) => {
        card.getAnimations().forEach(a => a.cancel());
        card.animate(
          [{ opacity: 0, transform: "translateY(18px)", filter: "blur(8px)" },
           { opacity: 1, transform: "translateY(0)", filter: "blur(0px)" }],
          { duration: 500, delay: 60 + i * 80, easing: "cubic-bezier(0.16,1,0.3,1)", fill: "backwards" }
        );
      });
    }
    popup.focus({ preventScroll: true });
  }

  function closePopover(returnFocus = true) {
    if (!isOpen) return;
    isOpen = false;
    trigger.setAttribute("aria-expanded", "false");
    const finish = () => { positioner.remove(); positioner = null; popup = null; state = null; };
    if (reduceMotion) tween({ ...state }, { ...state, o: 0 }, 120, t => t, finish);
    else tween({ ...state }, EXIT, 220, exitEase, finish);
    if (returnFocus) trigger.focus({ preventScroll: true });
  }

  trigger.addEventListener("click", () => (isOpen ? closePopover() : openPopover()));
  document.addEventListener("pointerdown", e => {
    if (!isOpen) return;
    if (popup.contains(e.target) || trigger.contains(e.target)) return;
    closePopover(false);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && isOpen) closePopover(); });
  addEventListener("resize", position);

  /* ---------- demo controls ---------- */
  const daysInput = document.getElementById("daysInput");
  const daysOut = document.getElementById("daysOut");
  daysInput.addEventListener("input", () => { daysOut.textContent = daysInput.value; setDays(+daysInput.value); });

  const root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
})();
</script>
</body>
</html>
