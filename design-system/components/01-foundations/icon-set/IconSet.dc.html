<!-- @dsCard group="Foundations" viewport="1200x800" name="Icon Set" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../../../styles.css">
<script src="../../../_ds_bundle.js"></script>
</helmet>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:{{ gap }}px;background:{{ bg }};padding:32px;border-radius:16px;width:fit-content">
  <sc-for list="{{ icons }}" as="icon" hint-placeholder-count="24">
    <div style="display:flex;align-items:center;justify-content:center;width:{{ cell }}px;height:{{ cell }}px" title="{{ icon.name }}">
      <svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" style="display:block">
        <g dangerouslySetInnerHTML="{{ icon.svgInner }}"></g>
      </svg>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:420},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:16,&quot;max&quot;:64,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffffff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ffffff&quot;,&quot;#000000&quot;,&quot;#5B5BD6&quot;,&quot;#E5484D&quot;]},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0d0d0d&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0d0d0d&quot;,&quot;#ffffff&quot;,&quot;transparent&quot;]},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:8,&quot;max&quot;:48,&quot;step&quot;:4,&quot;unit&quot;:&quot;px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const color = this.props.color ?? "#ffffff";
    const fillOp = this.props.solid ? color : color;
    const secOpacity = 0.55;
    const bgVal = this.props.bg ?? "#0d0d0d";
    const sw = 1.8;
    const S = { stroke: color, strokeWidth: sw };
    const raw = [
      ["Home", `<path d="M4 10.5 10.5 4.7a2.3 2.3 0 0 1 3 0L20 10.5" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9v9.5A1.5 1.5 0 0 0 7.5 20H10v-4.5A1.5 1.5 0 0 1 11.5 14h1A1.5 1.5 0 0 1 14 15.5V20h2.5a1.5 1.5 0 0 0 1.5-1.5V9" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["File", `<path d="M6.5 3.5h7l4 4v12a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M13.5 3.5v3.5a1 1 0 0 0 1 1h4" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Folder", `<path d="M4 6.5A1.5 1.5 0 0 1 5.5 5h4l2 2h7a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Window", `<rect x="6" y="3.5" width="12" height="17" rx="4" fill="none" stroke="${color}" stroke-width="${sw}"/><path d="M9.5 5.5h5" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`],
      ["Puzzle", `<path d="M9 4.5h3.2a1.2 1.2 0 0 1 1.2 1.4 1.6 1.6 0 1 0 3.2 0 1.2 1.2 0 0 1 1.2-1.4H19a1 1 0 0 1 1 1V9a1.2 1.2 0 0 1-1.4 1.2 1.6 1.6 0 1 0 0 3.2A1.2 1.2 0 0 1 20 14.6V18a1 1 0 0 1-1 1h-3.2a1.2 1.2 0 0 1-1.2-1.4 1.6 1.6 0 1 0-3.2 0A1.2 1.2 0 0 1 10.2 19H7a1 1 0 0 1-1-1v-3.2a1.2 1.2 0 0 1 1.4-1.2 1.6 1.6 0 1 0 0-3.2A1.2 1.2 0 0 1 6 9.2V5.5a1 1 0 0 1 1-1Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Play", `<path d="M7 4.5 19 12 7 19.5Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Grid", `<rect x="4" y="4" width="7.2" height="7.2" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><rect x="12.8" y="4" width="7.2" height="7.2" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><rect x="4" y="12.8" width="7.2" height="7.2" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><rect x="12.8" y="12.8" width="7.2" height="7.2" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/>`],
      ["Database", `<ellipse cx="12" cy="6" rx="7" ry="2.8" fill="${color}" fill-opacity="${secOpacity}" stroke="${color}" stroke-width="${sw}"/><path d="M5 6v6c0 1.5 3 2.8 7 2.8s7-1.3 7-2.8V6" fill="none" stroke="${color}" stroke-width="${sw}"/><path d="M5 12v6c0 1.5 3 2.8 7 2.8s7-1.3 7-2.8v-6" fill="none" stroke="${color}" stroke-width="${sw}"/>`],
      ["Toggle", `<rect x="3.5" y="7.5" width="17" height="9" rx="4.5" fill="none" stroke="${color}" stroke-width="${sw}"/><circle cx="9" cy="12" r="2.3" fill="${color}" fill-opacity="${secOpacity}" stroke="${color}" stroke-width="${sw}"/>`],
      ["Cursor", `<path d="M6 3.5 18.5 15 13 16l-2.5 5L6 3.5Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Moon", `<path d="M18.5 14.3A7.5 7.5 0 1 1 9.7 5.5a6 6 0 0 0 8.8 8.8Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Frame", `<rect x="8" y="8" width="8" height="8" rx="1.5" fill="${color}" fill-opacity="${secOpacity}"/><path d="M4 8V6a2 2 0 0 1 2-2h2M20 8V6a2 2 0 0 0-2-2h-2M4 16v2a2 2 0 0 0 2 2h2M20 16v2a2 2 0 0 1-2 2h-2" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`],
      ["Layout", `<rect x="4" y="4" width="7.5" height="16" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><rect x="13" y="4" width="7" height="7" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/>`],
      ["Sparkle", `<path d="M12 3.5 13.6 9 19 10.6 13.6 12.2 12 17.7 10.4 12.2 5 10.6 10.4 9Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Clock", `<circle cx="12" cy="12" r="8" fill="none" stroke="${color}" stroke-width="${sw}"/><path d="M12 8v4.2l3 2" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`],
      ["Mail", `<rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><path d="M4.5 7 12 12.5 19.5 7" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`],
      ["Monitor", `<rect x="3.5" y="4.5" width="17" height="11" rx="2" fill="none" stroke="${color}" stroke-width="${sw}"/><path d="M9 19.5h6M12 15.5v4" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`],
      ["Merge", `<rect x="5" y="5" width="10" height="10" rx="2.5" fill="none" stroke="${color}" stroke-width="${sw}"/><rect x="10" y="10" width="9" height="9" rx="2.5" fill="none" stroke="${color}" stroke-width="${sw}"/>`]
    ];
    return {
      bg: bgVal,
      color,
      size: this.props.size ?? 24,
      gap: this.props.gap ?? 24,
      cell: (this.props.size ?? 24) + 24,
      icons: raw.map(([name, svgInner]) => ({ name, svgInner: { __html: svgInner } }))
    };
  }
}
</script>
</body>
</html>
