<!-- @dsCard group="Overlays" viewport="800x500" name="Pill Toast" subtitle="Pill-shaped toast notification" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill Toast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --background: #ffffff;
  --foreground: oklch(0.145 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --border: oklch(0.922 0 0);
  --toast-normal: #18181b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --border: oklch(1 0 0 / 10%);
    --toast-normal: #27272a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --border: oklch(1 0 0 / 10%);
  --toast-normal: #27272a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--background); color: var(--foreground);
  min-height: 100dvh; -webkit-font-smoothing: antialiased;
  display: grid; place-items: center; padding: 16px;
}
button, select { font: inherit; }

/* demo */
.demo { display: grid; gap: 20px; justify-items: center; text-align: center; }
.demo h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; }
.demo p { margin: 0; font-size: 14px; color: var(--muted-foreground); max-width: 34ch; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.btn {
  height: 36px; padding: 0 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--background); color: var(--foreground);
  font-size: 14px; font-weight: 500; letter-spacing: -0.02em; transition: background-color 150ms;
}
.btn:hover { background: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--muted-foreground); outline-offset: 2px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; font-size: 13px; color: var(--muted-foreground); }
.ctrl select { height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); padding: 0 8px; }

/* toaster */
.toaster {
  position: fixed; z-index: 100; pointer-events: none;
  display: flex; flex-direction: column; gap: 10px;
}
.toaster[data-pos="top-left"]      { top: 16px; left: 16px; align-items: flex-start; }
.toaster[data-pos="top-center"]    { top: 16px; left: 0; right: 0; align-items: center; }
.toaster[data-pos="top-right"]     { top: 16px; right: 16px; align-items: flex-end; }
.toaster[data-pos="bottom-left"]   { bottom: 16px; left: 16px; align-items: flex-start; }
.toaster[data-pos="bottom-center"] { bottom: 16px; left: 0; right: 0; align-items: center; }
.toaster[data-pos="bottom-right"]  { bottom: 16px; right: 16px; align-items: flex-end; }
.toast-wrap { max-width: 100%; }

.toast {
  pointer-events: auto;
  display: flex; align-items: center; justify-content: space-between;
  width: auto; max-width: min(22rem, calc(100vw - 2rem));
  border-radius: 999px; color: #fff;
  padding: 6px;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
}
.toast.success { background: #16a34a; }
.toast.destructive { background: #ef4444; }
.toast.normal { background: var(--toast-normal); padding-left: 20px; }
.toast-main { display: flex; min-width: 0; align-items: center; gap: 12px; }
.toast-main > svg { width: 28px; height: 28px; flex-shrink: 0; }
.toast-msg {
  margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: -0.025em;
}
.toast-close {
  position: relative; margin-left: 16px; display: flex; width: 28px; height: 28px; flex-shrink: 0;
  align-items: center; justify-content: center; cursor: pointer;
  border: 0; border-radius: 999px; padding: 0; color: #fff;
  background: rgba(255,255,255,0.2); transition: background-color 150ms;
}
.toast-close:hover { background: rgba(255,255,255,0.1); }
.toast-close:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,0.7); }
.toast-close .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.toast-close .ring .track { stroke: rgba(255,255,255,0.2); }
.toast-close .ring .bar { stroke: #fff; }
.toast-close .x { width: 16px; height: 16px; }
</style>
</head>
<body>
<main class="demo">
  <h1>Pill Toast</h1>
  <p>Hover a toast to pause it. Click fast to see older toasts clear quickly. Three at most.</p>
  <div class="row">
    <button class="btn" type="button" data-t="success">Success</button>
    <button class="btn" type="button" data-t="error">Error</button>
    <button class="btn" type="button" data-t="normal">Normal</button>
    <button class="btn" type="button" data-t="long">Long message</button>
  </div>
  <div class="ctrl">
    <label>Position
      <select id="pos">
        <option>top-left</option><option>top-center</option><option>top-right</option>
        <option>bottom-left</option><option selected>bottom-center</option><option>bottom-right</option>
      </select>
    </label>
    <button class="btn" type="button" id="themeBtn" style="height:32px;font-size:13px">Toggle theme</button>
  </div>
</main>

<div class="toaster" id="toaster" data-pos="bottom-center" aria-live="polite" aria-relevant="additions text"></div>

<script>
(() => {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* spring -> CSS linear() easing, same physics as Motion's spring */
  function springEasing(k, c, m = 1) {
    const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    let x;
    if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); x = t => 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
    else if (z === 1) x = t => 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    else { const r1 = -w0 * (z - Math.sqrt(z * z - 1)), r2 = -w0 * (z + Math.sqrt(z * z - 1)); x = t => 1 - (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r2 - r1); }
    let T = 4;
    for (let t = 4; t > 0; t -= 1 / 240) { if (Math.abs(1 - x(t)) > 0.001) { T = t + 1 / 240; break; } }
    const n = 60, pts = [];
    for (let i = 0; i <= n; i++) pts.push(+x((T * i) / n).toFixed(4));
    pts[n] = 1;
    return { easing: `linear(${pts.join(",")})`, duration: Math.round(T * 1000) };
  }
  const Y_SPRING = springEasing(500, 25);      // Motion default for x/y
  const SCALE_SPRING = springEasing(550, 30);  // Motion default for scale
  const OPACITY_EASE = "cubic-bezier(0.25,0.1,0.35,1)";

  /* ---------- store (verbatim logic from toast-store.ts) ---------- */
  const MAX_TOASTS = 3, DEFAULT_DURATION = 4000, RAPID_WINDOW_MS = 1000, RAPID_DISMISS_MS = 280;
  let toasts = [], listeners = [], toastSeq = 0, lastAddedAt = 0;
  const emit = () => listeners.forEach(l => l());
  const accelerate = (now, items) => items.map(t => (t.expiresAt - now <= RAPID_DISMISS_MS ? t : { ...t, expiresAt: now + RAPID_DISMISS_MS }));
  const store = {
    add(t) {
      const now = Date.now(), duration = t.duration ?? DEFAULT_DURATION, id = `toast-${++toastSeq}`;
      const isRapid = lastAddedAt > 0 && now - lastAddedAt < RAPID_WINDOW_MS;
      lastAddedAt = now;
      const existing = isRapid ? accelerate(now, toasts) : toasts;
      const kept = existing.slice(-(MAX_TOASTS - 1));
      toasts = [...kept, { ...t, id, duration, createdAt: now, expiresAt: now + duration }];
      emit(); return id;
    },
    dismiss(id) { const next = toasts.filter(t => t.id !== id); if (next.length === toasts.length) return; toasts = next; emit(); },
    subscribe(l) { listeners.push(l); },
  };
  const toast = {
    success: (m, d = DEFAULT_DURATION) => store.add({ message: m, type: "success", duration: d }),
    error: (m, d = DEFAULT_DURATION) => store.add({ message: m, type: "destructive", duration: d }),
    normal: (m, d = DEFAULT_DURATION) => store.add({ message: m, type: "normal", duration: d }),
  };

  /* ---------- toast item ---------- */
  const ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11.9609 2.36157C17.4838 2.36157 21.9609 6.83872 21.9609 12.3616C21.9609 17.8844 17.4838 22.3616 11.9609 22.3616C6.43809 22.3616 1.96094 17.8844 1.96094 12.3616C1.96094 6.83872 6.43809 2.36157 11.9609 2.36157ZM17.4307 8.36938C17.0206 7.95933 16.3554 7.95933 15.9453 8.36938L10.1875 14.1262L7.97559 11.9143C7.5656 11.5046 6.90119 11.5046 6.49121 11.9143C6.08116 12.3244 6.08116 12.9896 6.49121 13.3997L9.44531 16.3538C9.85536 16.7638 10.5206 16.7638 10.9307 16.3538L17.4307 9.85376C17.8404 9.44378 17.8404 8.77937 17.4307 8.36938Z" fill="currentColor"/></svg>',
    destructive: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.666 22C17.189 22 21.666 17.523 21.666 12C21.666 6.477 17.189 2 11.666 2C6.14302 2 1.66602 6.477 1.66602 12C1.66602 17.523 6.14302 22 11.666 22ZM10.166 16.991C10.166 16.124 10.825 15.5 11.657 15.5C12.507 15.5 13.166 16.124 13.166 16.991C13.166 17.858 12.507 18.5 11.657 18.5C10.825 18.5 10.166 17.858 10.166 16.991ZM10.838 6C10.7705 6.00007 10.7038 6.01379 10.6418 6.04035C10.5797 6.0669 10.5237 6.10573 10.4771 6.1545C10.4305 6.20327 10.3942 6.26097 10.3705 6.32413C10.3468 6.38729 10.336 6.4546 10.339 6.522L10.645 13.522C10.6507 13.6508 10.7059 13.7724 10.799 13.8614C10.8922 13.9505 11.0161 14.0001 11.145 14H12.188C12.3169 14.0001 12.4409 13.9505 12.534 13.8614C12.6272 13.7724 12.6823 13.6508 12.688 13.522L12.993 6.522C12.996 6.45451 12.9853 6.38712 12.9615 6.3239C12.9377 6.26067 12.9013 6.20292 12.8546 6.15414C12.8079 6.10535 12.7517 6.06654 12.6896 6.04005C12.6274 6.01356 12.5606 5.99993 12.493 6H10.838Z" fill="currentColor"/></svg>',
    normal: "",
  };
  const RING_D = "M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831";

  class ToastItem {
    constructor(t) {
      this.t = t;
      this.remaining = Math.max(0, t.expiresAt - Date.now());
      this.paused = false;
      const wrap = document.createElement("div");
      wrap.className = "toast-wrap";
      const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
      wrap.innerHTML = `
        <div class="toast ${t.type}" role="status" data-slot="toast">
          <div class="toast-main">${ICONS[t.type]}<p class="toast-msg" title="${esc(t.message)}">${esc(t.message)}</p></div>
          <button type="button" class="toast-close" aria-label="Dismiss notification">
            <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
              <path class="track" d="${RING_D}" fill="none" stroke-width="3"/>
              <path class="bar" d="${RING_D}" fill="none" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="0"/>
            </svg>
            <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>`;
      this.el = wrap;
      this.bar = wrap.querySelector(".bar");
      const pill = wrap.querySelector(".toast");
      pill.addEventListener("mouseenter", () => this.pause());
      pill.addEventListener("mouseleave", () => this.resume(false));
      wrap.querySelector(".toast-close").addEventListener("click", () => store.dismiss(t.id));
      this.run(true);
    }
    update(t) { this.t = t; if (!this.paused) { this.stop(); this.run(true); } }
    run(syncStore) {
      let remaining = this.remaining;
      if (syncStore) remaining = Math.min(remaining, Math.max(0, this.t.expiresAt - Date.now()));
      this.remaining = remaining;
      if (remaining <= 0) { store.dismiss(this.t.id); return; }
      this.start = Date.now();
      const progress = 1 - remaining / this.t.duration;
      this.anim = this.bar.animate(
        [{ strokeDashoffset: 100 * Math.max(0, progress) }, { strokeDashoffset: 100 }],
        { duration: remaining, easing: "linear", fill: "forwards" }
      );
      this.timer = setTimeout(() => store.dismiss(this.t.id), remaining);
    }
    stop() {
      if (this.anim) { this.anim.cancel(); this.anim = null; }
      clearTimeout(this.timer);
      if (this.start) this.remaining = Math.max(0, this.remaining - (Date.now() - this.start));
      this.start = 0;
    }
    pause() {
      if (this.paused) return;
      this.paused = true;
      const off = this.bar.getAnimations()[0] ? getComputedStyle(this.bar).strokeDashoffset : null;
      this.stop();
      if (off) this.bar.style.strokeDashoffset = off;
    }
    resume() { if (!this.paused) return; this.paused = false; this.run(false); }
  }

  /* ---------- toaster with popLayout + layout FLIP ---------- */
  const toaster = document.getElementById("toaster");
  const items = new Map();
  const isTop = () => toaster.dataset.pos.includes("top");

  function render() {
    const before = new Map();
    items.forEach((it, id) => before.set(id, it.el.getBoundingClientRect()));
    const ids = new Set(toasts.map(t => t.id));

    // exits: pop out of layout, fade + shrink 0.16s
    items.forEach((it, id) => {
      if (ids.has(id)) return;
      it.stop();
      const r = before.get(id), cr = toaster.getBoundingClientRect();
      Object.assign(it.el.style, { position: "absolute", top: `${r.top - cr.top}px`, left: `${r.left - cr.left}px`, width: `${r.width}px`, margin: 0 });
      it.el.style.pointerEvents = "none";
      items.delete(id);
      const a = it.el.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(0.96)" }], { duration: reduceMotion ? 1 : 160, easing: OPACITY_EASE, fill: "forwards" });
      a.onfinish = () => it.el.remove();
    });

    // adds + order
    toasts.forEach(t => {
      let it = items.get(t.id);
      if (!it) { it = new ToastItem(t); items.set(t.id, it); it.isNew = true; }
      else if (it.t.expiresAt !== t.expiresAt) it.update(t);
      toaster.appendChild(it.el);
    });

    // layout FLIP for survivors, enter for new
    items.forEach((it, id) => {
      if (it.isNew) {
        it.isNew = false;
        if (reduceMotion) return;
        const y = isTop() ? -24 : 24;
        it.el.animate([{ translate: `0 ${y}px` }, { translate: "0 0" }], Y_SPRING);
        it.el.animate([{ scale: 0.96 }, { scale: 1 }], SCALE_SPRING);
        it.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: OPACITY_EASE });
        return;
      }
      const prev = before.get(id);
      if (!prev || reduceMotion) return;
      const now = it.el.getBoundingClientRect();
      const dy = prev.top - now.top, dx = prev.left - now.left;
      if (Math.abs(dy) < 0.5 && Math.abs(dx) < 0.5) return;
      it.el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0,0)" }], Y_SPRING);
    });
  }
  store.subscribe(render);

  /* ---------- demo ---------- */
  const actions = {
    success: () => toast.success("Operation successful!"),
    error: () => toast.error("Something went wrong."),
    normal: () => toast.normal("Just a notification."),
    long: () => toast.normal("This is a much longer notification message that will truncate inside the pill."),
  };
  document.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => actions[b.dataset.t]()));
  document.getElementById("pos").addEventListener("change", e => { toaster.dataset.pos = e.target.value; });
  const root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
})();
</script>
</body>
</html>
