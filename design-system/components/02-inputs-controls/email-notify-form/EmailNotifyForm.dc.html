<!-- @dsCard group="Inputs & Controls" viewport="1200x800" name="Email Notify Form" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../../../styles.css">
<script src="../../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', system-ui, sans-serif; }
  body, button, input { font-family: 'Montserrat', system-ui, sans-serif; }
  a { color: #059669; text-decoration: none; }
  a:hover { color: #047857; text-decoration: underline; }
  @keyframes bora-label-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>
<div style="display:flex;flex-direction:column;align-items:center;width:100%;padding:40px 20px;box-sizing:border-box;background:#FFFFFF">
  <div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px">
    <div style="width:100%;box-sizing:border-box;border-radius:100px;background:#F1F5F9;border:1px solid #E2E8F0;box-shadow:0 4px 8px rgba(15,23,42,0.10);padding:5px;display:flex">
      <form novalidate onSubmit="{{ onSubmit }}" style="flex:1;min-width:0;height:46px;display:flex;align-items:center;gap:6px;padding:4px;box-sizing:border-box;border-radius:100px;background:#FFFFFF;border:1px solid #E2E8F0;box-shadow:0 10px 28px -8px rgba(15,23,42,0.28), 0 3px 8px -2px rgba(15,23,42,0.12), inset 0 0 0 1px rgba(15,23,42,0.03)">
        <input type="email" placeholder="yourmail@example.com" aria-label="Email address" value="{{ email }}" onChange="{{ onChange }}" disabled="{{ inputDisabled }}" style="flex:1;padding:0 6px 0 14px;border-radius:100px;border:none;background-color:transparent;color:#0F172A;outline:none;height:100%;min-width:0;caret-color:#10B981;font-size:13.5px;font-weight:600;line-height:1em;letter-spacing:-0.01em">
        <button type="submit" tabindex="0" disabled="{{ busy }}" style="padding:0 18px;border-radius:100px;background-color:#0F172A;color:#FFFFFF;border:none;cursor:pointer;height:100%;white-space:nowrap;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:fit-content;font-family:'Montserrat', system-ui, sans-serif;font-size:13px;font-weight:700;line-height:1em;letter-spacing:-0.01em;transition:background-color .18s ease" style-hover="background-color:#1E293B">
          <span style="display:flex;align-items:center;justify-content:center;gap:7px">
            {{ labelEl }}
            <span style="display:flex;align-items:center;justify-content:center;opacity:{{ iconOpacity }}">
              <svg width="14" height="14" viewBox="0 0 24 24" role="presentation" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(-90deg)">
                <path d="M12 5v14"></path>
                <path d="m19 12-7 7-7-7"></path>
              </svg>
            </span>
          </span>
        </button>
      </form>
    </div>
    <div style="height:24px;margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;letter-spacing:-0.01em;color:#EF4444">{{ error }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:220},&quot;buttonLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Notify me&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { email: "", error: "", phase: "idle" };
  componentWillUnmount() { this.timers?.forEach(clearTimeout); }
  renderVals() {
    const p = this.state.phase;
    return {
      email: this.state.email,
      error: this.state.error,
      busy: p !== "idle",
      inputDisabled: p !== "idle",
      iconOpacity: p === "idle" ? 1 : 0.45,
      labelEl: React.createElement(
        "span",
        {
          key: p,
          style: {
            display: "inline-block",
            animation: "bora-label-in .26s cubic-bezier(.2,.7,.3,1) both"
          }
        },
        p === "sending" ? "Sending..."
          : p === "sent" ? "Sent!"
          : (this.props.buttonLabel ?? "Notify me")
      ),
      onChange: (e) => this.setState({ email: e.target.value, error: "" }),
      onSubmit: (e) => {
        e.preventDefault();
        if (this.state.phase !== "idle") return;
        const v = this.state.email.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
          this.setState({ error: "Enter a valid email address." });
          return;
        }
        this.timers = [];
        this.setState({ error: "", phase: "sending" });
        this.timers.push(setTimeout(() => this.setState({ phase: "sent" }), 3000));
        this.timers.push(setTimeout(() => this.setState({ phase: "idle", email: "" }), 6000));
      }
    };
  }
}
</script>
</body>
</html>
