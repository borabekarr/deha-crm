<style>
  html, body { margin: 0; background: #FCFCFC; font-family: 'Montserrat', system-ui, sans-serif; }
  a { color: #1A1919; text-decoration: none; }
  a:hover { color: #1A1919; }
  .lp { transition: background-color 420ms cubic-bezier(.22,1,.36,1), box-shadow 420ms cubic-bezier(.22,1,.36,1), padding 560ms cubic-bezier(.22,1.2,.36,1); }
  .lp:hover, .lp:focus-visible { background-color: #FFFFFF; box-shadow: rgba(0,0,0,0.19) 0 .48px 1.25px -1.33px, rgba(0,0,0,0.17) 0 2.6px 6.4px -2.67px, rgba(0,0,0,0.06) 0 10px 24px -4px, #FFFFFF 0 0 4px 2px inset; }
  .lp:focus-visible { outline: 1.5px solid var(--lp-accent); outline-offset: 3px; }
  .lp-ico { transition: color 240ms ease; color: #1A1919; }
  .lp:hover .lp-ico, .lp:focus-visible .lp-ico { color: var(--lp-accent); }
  .lp-slot { display: grid; grid-template-columns: 0fr; transition: grid-template-columns 560ms cubic-bezier(.22,1.2,.36,1); }
  .lp:hover .lp-slot, .lp:focus-visible .lp-slot { grid-template-columns: 1fr; }
  .lp-clip { overflow: hidden; min-width: 0; position: relative; display: flex; align-items: center; }
  .lp-label { transition: color 240ms ease, opacity 300ms ease, transform 560ms cubic-bezier(.22,1.2,.36,1); color: #1A1919; opacity: 0; transform: translateX(-6px); }
  .lp:hover .lp-label, .lp:focus-visible .lp-label { color: var(--lp-accent); opacity: 1; transform: translateX(0); }
  .lp-light { transition: transform 900ms cubic-bezier(.22,1,.36,1); }
  .lp:hover .lp-light, .lp:focus-visible .lp-light { transform: translateX(120px) skewX(-16deg); }
  @media (prefers-reduced-motion: reduce) { .lp, .lp-ico, .lp-label, .lp-light { transition-duration: 0.01ms !important; } }
</style>
</helmet>

<div style="min-height: 100vh; box-sizing: border-box; background: #FCFCFC; display: flex; align-items: center; justify-content: center; padding: 48px 24px; overflow: hidden;">
  <div style="transform: scale(1.4); transform-origin: 50% 50%;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="3">
        <a class="lp" href="{{ item.href }}" style="--lp-accent: {{ item.accent }}; box-sizing: border-box; display: inline-flex; align-items: center; gap: 0; height: 34px; width: auto; min-width: 34px; justify-content: center; padding: 0 8px; border: 1px solid #FFFFFF; border-radius: 22px; background-color: #F9F9F9; position: relative; overflow: hidden; box-shadow: rgba(0,0,0,0.19) 0 0.48175px 1.25255px -1.33333px, rgba(0,0,0,0.17) 0 1.83083px 4.76015px -2.66667px, rgba(0,0,0,0.05) 0 8px 20.8px -4px, #FFFFFF 0 0 4px 2px inset;">
          <span class="lp-ico" style="display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; filter: brightness(1.1);">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="{{ item.path2 }}"></path><path d="{{ item.path }}" fill-rule="{{ item.rule }}" clip-rule="evenodd"></path></svg>
          </span>
          <span class="lp-slot">
            <span class="lp-clip">
              <span class="lp-light" style="position: absolute; top: -10px; bottom: -10px; left: -46px; width: 16px; background: #FFFFFF; filter: blur(2px); opacity: 0.6; transform: skewX(-16deg); pointer-events: none;"></span>
              <span class="lp-label" style="position: relative; padding-left: 4px; font-size: 10px; font-weight: 900; letter-spacing: -0.005em; white-space: nowrap;">{{ item.label }}</span>
            </span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
