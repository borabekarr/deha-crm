<!-- @dsCard group="Marketing & Pricing" viewport="1200x800" name="Team Member Carousel" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../../colors_and_type.css">
<link rel="stylesheet" href="../../../styles.css">
<script src="../../../_ds_bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html body { background: rgb(255, 255, 255); margin: 0; }
  @media (prefers-reduced-motion: reduce) { .tmc-anim { transition: none !important; } }
</style>
</helmet>
<div tabindex="0" role="region" aria-label="Team member carousel" style="height:574px; width:100%; position:relative; overflow:hidden; background:rgb(255, 255, 255); outline:none; display:flex; align-items:center; justify-content:center; font-family:'Inter', sans-serif">
  <button type="button" aria-label="Previous" onClick="{{ prev }}" style="width:48px; height:48px; border-radius:999px; border:1px solid rgba(0,0,0,0.06); background:rgba(255, 255, 255, 0.75); box-shadow:0 8px 24px rgba(0,0,0,0.10); display:grid; place-items:center; cursor:pointer; user-select:none; backdrop-filter:blur(10px); position:absolute; left:18px; top:50%; margin-top:-24px; z-index:5">
    <svg width="21" height="21" viewBox="0 0 24 24" style="transform:rotate(180deg)" aria-hidden="true"><path d="M9 18l6-6-6-6" fill="none" stroke="rgb(0, 0, 0)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </button>
  <button type="button" aria-label="Next" onClick="{{ next }}" style="width:48px; height:48px; border-radius:999px; border:1px solid rgba(0,0,0,0.06); background:rgba(255, 255, 255, 0.75); box-shadow:0 8px 24px rgba(0,0,0,0.10); display:grid; place-items:center; cursor:pointer; user-select:none; backdrop-filter:blur(10px); position:absolute; right:18px; top:50%; margin-top:-24px; z-index:5">
    <svg width="21" height="21" viewBox="0 0 24 24" style="transform:rotate(0deg)" aria-hidden="true"><path d="M9 18l6-6-6-6" fill="none" stroke="rgb(0, 0, 0)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </button>
  <div ref="{{ viewportRef }}" style="position:relative; width:100%; height:100%; padding:48px; box-sizing:border-box; overflow:hidden">
    <div aria-label="Carousel track" class="tmc-anim" draggable="false" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" style="position:relative; height:100%; display:flex; align-items:center; gap:34px; touch-action:pan-y; user-select:none; will-change:transform; transition:{{ trackTransition }}; transform:{{ trackTransform }}">
      <sc-for list="{{ cards }}" as="card" hint-placeholder-count="5">
        <article role="button" tabindex="-1" aria-label="{{ card.aria }}" onClick="{{ card.go }}" class="tmc-anim" style="position:relative; width:324px; height:478px; flex:0 0 auto; border-radius:32px; overflow:hidden; cursor:pointer; background:rgb(255, 255, 255); box-shadow:0 10px 30px rgba(0,0,0,0.06); will-change:transform; transition:transform 620ms cubic-bezier(0.22,1,0.36,1); transform:{{ card.cardTransform }}">
          <div class="tmc-anim" style="position:absolute; top:10px; left:10px; right:10px; overflow:hidden; z-index:2; border-radius:20px; transition:height 620ms cubic-bezier(0.22,1,0.36,1); height:{{ card.mediaHeight }}">
            {{ card.el }}
          </div>
          <div class="tmc-anim" style="position:absolute; inset:56% 0px 0px; background:rgb(255, 255, 255); border-radius:0px 0px 32px 32px; padding:20px 22px 22px; z-index:1; display:flex; flex-direction:column; justify-content:flex-end; will-change:transform; transition:opacity 420ms ease, transform 620ms cubic-bezier(0.22,1,0.36,1); opacity:{{ card.infoOpacity }}; transform:{{ card.infoTransform }}">
            <div style="font-size:24px; font-weight:600; letter-spacing:-0.02em; line-height:1.05em; color:rgb(0, 0, 0); margin:0">{{ card.name }}</div>
            <div style="font-size:14px; font-weight:500; letter-spacing:-0.01em; line-height:1.35em; color:rgb(0, 0, 0); opacity:0.82; margin-top:8px">{{ card.bio }}</div>
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px">
              <span style="font-size:12px; font-weight:500; letter-spacing:-0.01em; line-height:1em; padding:7px 10px; border-radius:999px; background:rgb(245, 245, 245); color:rgb(0, 0, 0); white-space:nowrap">{{ card.role }}</span>
              <a href="{{ card.href }}" target="_blank" rel="noopener noreferrer" aria-label="{{ card.linkAria }}" style="font-size:13px; font-weight:600; letter-spacing:-0.01em; line-height:1em; padding:10px 14px; border-radius:999px; background:rgb(17, 17, 17); color:rgb(255, 255, 255); border:1px solid rgba(0,0,0,0.10); cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; justify-content:center">View Profile</a>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:574},&quot;members&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{name:string;bio:string;role:string;img:string;href?:string}&gt;&quot;}}">
const CARD_W = 324, GAP = 34, STEP = CARD_W + GAP;

const MEMBERS = [
  { name: "Mario Tomsen", bio: "Product Designer focused on intuitive digital experiences.", role: "Product Design", img: "https://framerusercontent.com/images/FZBZUenR1H40VCwpYo2kL7iinM.jpg?width=785&height=981", href: "https://framer.link/SYJK4Bv" },
  { name: "Linda Fuchs", bio: "Design Engineer blending craft and performance for the web.", role: "Design Systems", img: "https://framerusercontent.com/images/f5zryt3FIGq6MILNY4p1OkAWJqQ.jpg?width=785&height=981", href: "https://framer.link/SYJK4Bv" },
  { name: "Ava Kim", bio: "Brand Designer with a love for editorial typography and detail.", role: "Brand", img: "https://framerusercontent.com/images/VuGr1lEI6cBjMEdTS3rHo6wsitk.jpg?width=785&height=981", href: "https://framer.link/SYJK4Bv" },
  { name: "Noah Carter", bio: "Product Designer focused on intuitive digital experiences.", role: "Product Design", img: "https://framerusercontent.com/images/tKzuh1pIYK02x91NXHwyjshcKY.jpg?width=785&height=981", href: "https://framer.link/SYJK4Bv" },
  { name: "Marcus Berendt", bio: "Product Designer focused on intuitive digital experiences.", role: "Product Design", img: "https://framerusercontent.com/images/i30SKWPgobJV0IYNTZYKih5v0Mg.jpg?width=785&height=981", href: "https://framer.link/SYJK4Bv" }
];

class Component extends DCLogic {
  state = { index: 2, drag: 0, inner: 0 };

  constructor(props) {
    super(props);
    this.viewportRef = React.createRef();
    this.startX = null;
  }

  get list() { return this.props.members && this.props.members.length ? this.props.members : MEMBERS; }

  measure = () => {
    const el = this.viewportRef.current;
    if (!el) return;
    const cs = getComputedStyle(el);
    const inner = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (inner !== this.state.inner) this.setState({ inner });
  };

  componentDidMount() {
    this.measure();
    window.addEventListener("resize", this.measure);
    this.onKey = (e) => {
      if (e.key === "ArrowRight") this.next();
      if (e.key === "ArrowLeft") this.prev();
    };
    window.addEventListener("keydown", this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener("resize", this.measure);
    window.removeEventListener("keydown", this.onKey);
  }

  go = (i) => this.setState({ index: Math.max(0, Math.min(this.list.length - 1, i)), drag: 0 });
  next = () => this.go(this.state.index + 1);
  prev = () => this.go(this.state.index - 1);

  onDown = (e) => {
    this.startX = e.clientX;
    if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  };
  onMove = (e) => {
    if (this.startX === null) return;
    this.setState({ drag: e.clientX - this.startX });
  };
  onUp = () => {
    if (this.startX === null) return;
    const d = this.state.drag;
    this.startX = null;
    if (Math.abs(d) > 60) this.go(this.state.index + (d < 0 ? 1 : -1));
    else this.setState({ drag: 0 });
  };

  renderVals() {
    const { index, drag, inner } = this.state;
    const offset = (inner || 0) / 2 - CARD_W / 2 - index * STEP + drag;

    const cards = this.list.map((m, i) => {
      const active = i === index;
      const near = Math.abs(i - index) === 1;
      return {
        ...m,
        aria: m.name + " card",
        linkAria: "View Profile for " + m.name,
        go: () => this.go(i),
        cardTransform: active ? "translateY(-4px) scale(1.02)" : (near ? "scale(0.97)" : "none"),
        mediaHeight: active ? "calc(56% - 20px)" : "calc(100% - 20px)",
        el: React.createElement("img", {
          src: m.img, alt: "Portrait", draggable: false,
          style: { width: "100%", height: "458px", objectFit: "cover", display: "block", transform: "translateZ(0px)", objectPosition: active ? "center 90%" : "center center" }
        }),
        infoOpacity: active ? "1" : "0",
        infoTransform: active ? "none" : "translateY(18px)"
      };
    });

    return {
      cards,
      viewportRef: this.viewportRef,
      trackTransform: "translateX(" + offset + "px)",
      trackTransition: inner ? "transform 620ms cubic-bezier(0.22,1,0.36,1)" : "none",
      next: this.next, prev: this.prev,
      onDown: this.onDown, onMove: this.onMove, onUp: this.onUp
    };
  }
}
</script>
</body>
</html>
